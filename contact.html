<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="contact-page">

        <!-- My Story -->
        <p class="my-story">My Story</p>

        <!-- ナビゲーション -->
        <nav class="contact-nav">
            <a href="about.html">ABOUT</a>
            <a href="favorites.html">FAVORITES</a>
            <a href="dream.html">DREAM</a>
            <a href="message.html">MESSAGE</a>
        </nav>

        <!-- CONTACTメイン -->
        <section class="contact-content">

            <p class="contact-label">CONTACT</p>

            <h1>Let's talk.</h1>

            <p class="contact-question">
                What did you find in my story?
            </p>

            <p class="contact-intro">
                このサイトを見て、<br>
                共感したこと、好きなもの、気になったこと。<br>
                あなたの言葉を自由に残してください。
            </p>

            <!-- メッセージフォーム -->
            <form class="contact-form">

                <div class="form-group">
                    <label for="name">NAME</label>
                    <input type="text" id="name" name="name" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="message">MESSAGE</label>
                    <textarea id="message" name="message" placeholder="Tell me what you think..."></textarea>
                </div>

                <button type="submit">SEND →</button>

            </form>

        </section>

    </main>

</body>

</html>
